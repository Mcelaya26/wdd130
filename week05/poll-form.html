        <form>
            <fieldset>
                <legend>Contact Information</legend>
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email:</label>
            <input type="email" id="useremail" name="useremail" required></fieldset>

            <fieldset>
                <legend>Questions</legend>
            
            <label for="browser">What is your favorite browser?</label>
            <select name="browser" id="browser">
                <option value="Firefox">Firefox</option>
                <option value="Chrome">Chrome</option>
                <option value="Edge">Edge</option>
                <option value="Safari">Safari</option>
                <option value="Brave">Brave</option>
                <option value="Other">Other</option>
            </select>

            <label for="pet">Do you have a household pet?<input type="checkbox" id="pet" name="pet"></label>
            
            <label for="feedback">List the places you have lived.</label>
            <textarea id="feedback" name="feedback"  rows="4" placeholder="Providence Utah, Bute Mississippi, Chelan Washington, New York New York"></textarea>
            </fieldset>

            <button type="reset">Reset</button>
            <button type="submit">Submit</button>


        </form>
    </main>
</body>
